<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaloFoto — фото и видео</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0d1017;
    color:#f4f6fb;
}

header{
    position:sticky;
    top:0;
    z-index:10;
    background:#151923ee;
    backdrop-filter:blur(14px);
    border-bottom:1px solid #292e3a;
}

nav{
    max-width:1050px;
    margin:auto;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:800;
    color:#a687ff;
}

.tag{
    color:#8f97a8;
    font-size:13px;
}

main{
    max-width:1050px;
    margin:25px auto;
    padding:0 20px;
}

.panel,.post{
    background:#171b25;
    border:1px solid #292e3a;
    border-radius:18px;
}

.panel{
    padding:20px;
    margin-bottom:22px;
}

h1{
    margin:0 0 8px;
    font-size:28px;
}

h2{
    margin-top:0;
}

.muted{
    color:#969eaf;
}

input,textarea,button{
    font:inherit;
}

input,textarea{
    width:100%;
    background:#0f1219;
    color:white;
    border:1px solid #303645;
    border-radius:11px;
    padding:11px;
    margin:6px 0;
}

textarea{
    min-height:80px;
    resize:vertical;
}

button{
    border:0;
    border-radius:11px;
    padding:10px 15px;
    background:#8b6cff;
    color:white;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.12);
}

.secondary{
    background:#292e3a;
}

.danger{
    background:#402128;
    color:#ffb8c0;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.search{
    margin-bottom:20px;
}

.feed{
    display:grid;
    gap:18px;
}

.post{
    overflow:hidden;
}

.post-head{
    padding:15px 16px;
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.post-title{
    font-weight:700;
    font-size:18px;
}

.media{
    width:100%;
    max-height:650px;
    display:block;
    object-fit:contain;
    background:#080a0f;
}

.post-body{
    padding:16px;
}

.actions{
    display:flex;
    gap:8px;
    margin:14px 0;
    flex-wrap:wrap;
}

.comments{
    border-top:1px solid #292e3a;
    margin-top:15px;
    padding-top:13px;
}

.comment{
    padding:10px 0;
    border-bottom:1px solid #242936;
}

.comment b{
    color:#b9a8ff;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    margin-top:7px;
}

.approved{
    background:#173b2a;
    color:#7ff0ad;
}

.review{
    background:#493b16;
    color:#ffd86b;
}

.blocked{
    background:#452027;
    color:#ff9da8;
}

.empty{
    text-align:center;
    padding:45px 15px;
    color:#8f97a8;
}

small{
    color:#7e8799;
}

.profile{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#8b6cff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.mod-box{
    background:#11151e;
    border:1px solid #303645;
    border-radius:13px;
    padding:13px;
    margin-top:12px;
}

@media(max-width:650px){
    .row{
        grid-template-columns:1fr;
    }

    .tag{
        display:none;
    }

    nav{
        padding:13px;
    }

    main{
        padding:0 12px;
    }

    .post-head{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>
<nav>
    <div class="logo">📸 LaloFoto</div>
    <div class="tag">Фото • видео • люди • комментарии</div>
</nav>
</header>

<main>

<section class="panel">

<h1>Создать публикацию</h1>

<p class="muted">
Делись фотографиями и видео с другими пользователями.
</p>

<form id="postForm">

<div class="row">

<input
id="author"
placeholder="Твоё имя"
maxlength="30"
required
>

<input
id="title"
placeholder="Название публикации"
maxlength="80"
required
>

</div>

<input
id="file"
type="file"
accept="image/*,video/*"
required
>

<textarea
id="description"
placeholder="Описание публикации..."
maxlength="500"
></textarea>

<button type="submit">
Опубликовать
</button>

</form>

</section>


<section class="panel">

<h2>🔎 Поиск</h2>

<input
id="search"
placeholder="Поиск по названию, автору или описанию..."
>

</section>


<section id="feed" class="feed"></section>

</main>


<script>

const KEY = "lalofoto_posts_v1";

let posts = JSON.parse(
    localStorage.getItem(KEY) || "[]"
);


/* ---------- СОХРАНЕНИЕ ---------- */

function save(){
    localStorage.setItem(
        KEY,
        JSON.stringify(posts)
    );
}


/* ---------- БЕЗОПАСНЫЙ ТЕКСТ ---------- */

function esc(s){
    return String(s).replace(
        /[&<>"']/g,
        c => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[c])
    );
}


/* ---------- ПРОСТАЯ ИИ-МОДЕРАЦИЯ ---------- */

function moderate(text){

    const badWords = [
        "спам",
        "мошенник",
        "убить",
        "взлом",
        "наркотик"
    ];

    const value = text.toLowerCase();

    for(const word of badWords){

        if(value.includes(word)){
            return {
                status:"review",
                reason:"Публикация отправлена на проверку модератору."
            };
        }

    }

    return {
        status:"approved",
        reason:"Проверка пройдена."
    };
}


/* ---------- РЕНДЕР ---------- */

function render(){

    const feed =
        document.getElementById("feed");

    const query =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    let visible = posts.filter(p => {

        const text =
            `${p.title} ${p.author} ${p.description}`
            .toLowerCase();

        return text.includes(query);

    });


    if(!visible.length){

        feed.innerHTML = `
        <div class="panel empty">
            Публикаций не найдено.
        </div>
        `;

        return;
    }


    feed.innerHTML = visible.map(p => {

        const realIndex =
            posts.indexOf(p);

        const comments =
            p.comments || [];

        let media = "";

        if(p.type.startsWith("image/")){

            media = `
            <img
                class="media"
                src="${p.data}"
                alt=""
            >
            `;

        }else{

            media = `
            <video
                class="media"
                controls
                src="${p.data}">
            </video>
            `;

        }


        return `

<article class="post">

<div class="post-head">

<div>

<div class="profile">

<div class="avatar">
${esc(p.author.charAt(0).toUpperCase())}
</div>

<div>

<div class="post-title">
${esc(p.title)}
</div>

<small>
@${esc(p.author)}
•
${new Date(p.date).toLocaleString("ru-RU")}
</small>

</div>

</div>

<span class="status ${p.status}">
${
p.status === "approved"
? "✓ Проверено"
: "⏳ На модерации"
}
</span>

</div>

<button
class="danger"
onclick="removePost(${realIndex})">
Удалить
</button>

</div>


${media}


<div class="post-body">

${
p.description
? `<div>${esc(p.description)}</div>`
: ""
}


<div class="actions">

<button
onclick="like(${realIndex})">
❤️ ${p.likes}
</button>

<button
class="secondary"
onclick="reportPost(${realIndex})">
🚨 Пожаловаться
</button>

</div>


<div class="comments">

<b>💬 Комментарии</b>

${
comments.length
?
comments.map(c => `

<div class="comment">

<b>${esc(c.author)}</b>:
${esc(c.text)}

</div>

`).join("")
:
"<small>Пока никто не прокомментировал.</small>"
}


<form
onsubmit="comment(event,${realIndex})"
class="row"
style="margin-top:12px"
>

<input
name="author"
placeholder="Имя"
maxlength="30"
required
>

<input
name="text"
placeholder="Написать комментарий..."
maxlength="300"
required
>

<button
style="grid-column:1/-1">
Отправить
</button>

</form>

</div>

</div>

</article>

`;

    }).join("");

}


/* ---------- ЛАЙК ---------- */

function like(i){

    posts[i].likes++;

    save();
    render();

}


/* ---------- УДАЛЕНИЕ ---------- */

function removePost(i){

    if(
        confirm("Удалить эту публикацию?")
    ){

        posts.splice(i,1);

        save();
        render();

    }

}


/* ---------- ЖАЛОБА ---------- */

function reportPost(i){

    posts[i].reports =
        (posts[i].reports || 0) + 1;

    if(posts[i].reports >= 3){

        posts[i].status = "review";

    }

    save();

    alert(
        "Жалоба отправлена модераторам."
    );

    render();

}


/* ---------- КОММЕНТАРИЙ ---------- */

function comment(e,i){

    e.preventDefault();

    const form = e.target;

    const text =
        form.text.value.trim();

    const author =
        form.author.value.trim();

    if(!text || !author) return;


    const check =
        moderate(text);


    if(check.status === "review"){

        alert(
            "Комментарий отправлен на проверку."
        );

    }


    posts[i].comments.push({

        author:author,

        text:text,

        date:Date.now()

    });


    save();

    render();

}


/* ---------- СОЗДАНИЕ ПОСТА ---------- */

document
.getElementById("postForm")
.addEventListener("submit", e => {

    e.preventDefault();

    const form = e.target;

    const file =
        document
        .getElementById("file")
        .files[0];

    if(!file) return;


    const reader =
        new FileReader();


    reader.onload = () => {

        const description =
            form.description.value.trim();


        const moderation =
            moderate(
                form.title.value +
                " " +
                description
            );


        const post = {

            author:
                form.author.value.trim(),

            title:
                form.title.value.trim(),

            description:
                description,

            data:
                reader.result,

            type:
                file.type,

            likes:0,

            comments:[],

            reports:0,

            status:
                moderation.status,

            date:
                Date.now()

        };


        posts.unshift(post);

        save();

        form.reset();

        render();


        if(
            moderation.status === "review"
        ){

            alert(
                "Публикация отправлена на модерацию."
            );

        }else{

            alert(
                "Публикация успешно добавлена!"
            );

        }

    };


    reader.readAsDataURL(file);

});


/* ---------- ПОИСК ---------- */

document
.getElementById("search")
.addEventListener(
    "input",
    render
);


/* ---------- ЗАПУСК ---------- */

render();

</script>

</body>
  </html>
